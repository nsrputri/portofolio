<!doctype html>
<!-- Served by the host for any address that does not exist (Cloudflare Pages uses a top-level 404.html),
     so a mistyped link gets a real 404 instead of the home page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Halaman tidak ditemukan</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #efebe4;
        color: #2a2826;
        font: 16px / 1.6 system-ui, sans-serif;
        text-align: center;
      }

      h1 {
        font: 400 clamp(32px, 6vw, 56px) / 1.05 Georgia, serif;
      }

      p {
        margin-top: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 999px;
        background: #1f1e1c;
        color: #fff;
        text-decoration: none;
        font: 500 13px ui-monospace, monospace;
        letter-spacing: 0.08em;
      }

      a:focus-visible {
        outline: 2px solid #2a2826;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page does not exist. · <span lang="id">Halaman ini tidak ada.</span></p>
      <a href="/">Back to the portfolio · <span lang="id">Kembali ke portofolio</span></a>
    </main>
  </body>
</html>
